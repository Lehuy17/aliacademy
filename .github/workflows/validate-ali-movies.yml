name: ALI Movie Quality Gate

on:
  push:
    paths:
      - 'ali-movies.json'
      - 'captions/**'
      - 'media/**'
      - 'scripts/validate-ali-movies.cjs'
      - 'docs/ALI_MOVIE_STANDARD.md'
      - 'docs/ALI_MOVIE_LEGACY_BASELINE.json'
      - '.github/workflows/validate-ali-movies.yml'
  pull_request:
    paths:
      - 'ali-movies.json'
      - 'captions/**'
      - 'media/**'
      - 'scripts/validate-ali-movies.cjs'
      - '.github/workflows/validate-ali-movies.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install FFprobe when unavailable
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Validate all published movies
        run: node scripts/validate-ali-movies.cjs
