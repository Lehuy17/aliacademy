name: Publish Spider-Man synchronized web video

on:
  push:
    paths:
      - '.github/workflows/prepare-spiderman-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-synced-video:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Download the authorized ALI source file
        env:
          GOOGLE_DRIVE_ID: 1LshhXuuIT6HR1LpvXJ6uDdAthDNkZ8Dx
        run: |
          python3 -m pip install --user --quiet gdown
          "$HOME/.local/bin/gdown" --id "$GOOGLE_DRIVE_ID" --output /tmp/ali-spiderman-original.mp4
          test "$(stat -c%s /tmp/ali-spiderman-original.mp4)" -gt 100000000
          ffprobe -v error -show_entries format=duration -of default=nw=1 /tmp/ali-spiderman-original.mp4

      - name: Encode a compact seekable MP4 for ALI subtitles
        run: |
          mkdir -p media
          ffmpeg -hide_banner -loglevel error -nostdin -y \
            -i /tmp/ali-spiderman-original.mp4 \
            -map 0:v:0 -map 0:a:0 \
            -vf "scale=854:480:flags=bicubic,fps=24" \
            -c:v libx264 -preset veryfast -profile:v main -level 3.1 \
            -pix_fmt yuv420p -b:v 520k -maxrate 780k -bufsize 1560k -g 48 \
            -c:a aac -b:a 64k -ar 44100 -ac 2 \
            -movflags +faststart \
            media/spiderman-sync.mp4

      - name: Check web video size and duration
        run: |
          python3 - <<'PY'
          import json,subprocess,os
          path='media/spiderman-sync.mp4'
          size=os.path.getsize(path)
          meta=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration:stream=codec_name','-of','json',path]))
          duration=float(meta['format']['duration'])
          assert 570 <= duration <= 590, f"Unexpected duration: {duration}"
          assert 1_000_000 < size < 95_000_000, f"Output too large for GitHub Pages: {size}"
          assert any(t['codec_name']=='h264' for t in meta['streams']), "H.264 missing"
          print(f"Synced video OK: {duration:.1f}s, {size/1048576:.1f}MiB")
          PY

      - name: Enable true HTML5 subtitle synchronization
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('ali-movies.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          movie=next((x for x in data['movies'] if x['id']=='spiderman-nwh-2021-doing-this-long-time'),None)
          if movie is None: raise RuntimeError('Spider-Man entry missing')
          movie['source']={'type':'url','url':'./media/spiderman-sync.mp4'}
          movie['presentation']['layout']='video-left-captions-right'
          movie['presentation']['background']='film-blur'
          movie['duration']='09:41'
          movie.pop('availability',None)
          data['version']=int(data.get('version',1))+1
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit website video and catalog
        run: |
          git config user.name "ALI Academy Website Bot"
          git config user.email "ali-website-bot@users.noreply.github.com"
          git add media/spiderman-sync.mp4 ali-movies.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish H.264 Spider-Man excerpt with interactive synchronized captions"
          git push origin HEAD:main
