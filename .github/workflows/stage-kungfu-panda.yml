name: Stage Kung Fu Panda for ALI Cinema

on:
  push:
    paths:
      - '.github/workflows/stage-kungfu-panda.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ali-kung-fu-panda-stage
  cancel-in-progress: true

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out ALI website
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
          command -v ffmpeg
          command -v ffprobe

      - name: Download ALI Descript MP4 export
        env:
          DESCRIPT_EXPORT_URL: 'https://media.descriptusercontent.com/v3/proxy/remux?url=https%3A%2F%2Fapi.descript.com%2Fv2%2Fpublished_projects%2F2fe01c1d-c616-41e7-86ee-287309c5fe50%2Fhls%3Fexpiration%3D1794374961137%26signature%3Daec16b7f5a878bc4264d0d750a651b11f9ceca1f65fe0c44a56341bd8ab6ad6f&filename=Transcript.mp4&mediaCacheBucketName=production-273614-media-cache&expiration=1794371361&signature=55dc90a1e23f2c8949c4d547bc981b50c1252ca6151a6617b41f3279b3271f42'
        run: |
          mkdir -p /tmp/ali-kungfu
          curl --fail --location --silent --show-error \
            --retry 4 --retry-delay 6 --retry-all-errors \
            --output /tmp/ali-kungfu/input.mp4 "$DESCRIPT_EXPORT_URL"
          test "$(stat -c%s /tmp/ali-kungfu/input.mp4)" -gt 3000000
          ffprobe -v error -show_entries format=duration -of default=nw=1 /tmp/ali-kungfu/input.mp4

      - name: Convert to standardized HTML5 MP4 and real poster
        run: |
          set -euo pipefail
          input="$(find /tmp/ali-kungfu -type f -size +3M -print -quit)"
          target='media/kung-fu-panda-po-vs-tai-lung-final-battle'
          mkdir -p "$target"
          ffmpeg -hide_banner -loglevel error -y -nostdin -i "$input" \
            -map 0:v:0 -map 0:a:0 \
            -vf 'scale=854:480:force_original_aspect_ratio=decrease:force_divisible_by=2,fps=24' \
            -c:v libx264 -preset veryfast -crf 29 \
            -pix_fmt yuv420p -c:a aac -b:a 64k -ar 44100 -ac 2 \
            -movflags +faststart \
            "$target/video.mp4"
          ffmpeg -hide_banner -loglevel error -y -nostdin -ss 26 -i "$target/video.mp4" \
            -frames:v 1 -q:v 3 "$target/poster.jpg"

      - name: Verify MP4, poster and bilingual JSON
        run: |
          python3 - <<'PY'
          import json,os,subprocess,pathlib
          slug='kung-fu-panda-po-vs-tai-lung-final-battle'
          video=f'media/{slug}/video.mp4'
          poster=f'media/{slug}/poster.jpg'
          captions=json.loads(pathlib.Path(f'captions/{slug}.json').read_text())
          meta=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries',
             'format=duration:stream=codec_type,codec_name,pix_fmt','-of','json',video]))
          dur=float(meta['format']['duration'])
          v=next(t for t in meta['streams'] if t['codec_type']=='video')
          a=next(t for t in meta['streams'] if t['codec_type']=='audio')
          assert 545 <= dur <= 555, f'Unexpected duration {dur}'
          assert v['codec_name']=='h264' and v['pix_fmt']=='yuv420p'
          assert a['codec_name']=='aac'
          assert os.path.getsize(video)<90*1048576, 'Video too large for GitHub'
          assert os.path.getsize(poster)>2500, 'Preview frame failed'
          assert len(captions['cues'])==58, 'Unexpected subtitle count'
          assert all(isinstance(c['start'],(int,float)) and c['end']>c['start']
             and c['en'].strip() and c['vi'].strip() for c in captions['cues'])
          print('Video and bilingual captions verified:',dur,'seconds; video',
                round(os.path.getsize(video)/1048576,2),'MiB')
          PY

      - name: Commit staged media without public catalog changes
        run: |
          git config user.name 'ALI Academy Website Bot'
          git config user.email 'ali-website-bot@users.noreply.github.com'
          git add media/kung-fu-panda-po-vs-tai-lung-final-battle/video.mp4 \
                  media/kung-fu-panda-po-vs-tai-lung-final-battle/poster.jpg
          git diff --cached --quiet && exit 0
          git commit -m 'Stage verified HTML5 Kung Fu Panda media and preview for ALI'
          git pull --rebase origin main
          git push origin HEAD:main
