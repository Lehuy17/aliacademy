name: Publish ALI TOEIC Listening MP3

on:
  push:
    paths:
      - '.github/workflows/publish-ali-toeic-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ali-toeic-audio-publish
  cancel-in-progress: false

jobs:
  publish-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout ALI Academy
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install MP3 download and verification tools
        run: |
          python -m pip install --disable-pip-version-check gdown
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download provided public TOEIC MP3
        run: |
          mkdir -p media/ali-tests
          python -m gdown --id '13Jf5qy_bPg55PNXfzqUdqsam41bWg4lX' --output media/ali-tests/toeic-listening-test.mp3
          test "$(wc -c < media/ali-tests/toeic-listening-test.mp3)" -gt 14000000
          test "$(wc -c < media/ali-tests/toeic-listening-test.mp3)" -lt 30000000
          file media/ali-tests/toeic-listening-test.mp3
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 media/ali-tests/toeic-listening-test.mp3
          python - <<'PY'
          import subprocess
          path='media/ali-tests/toeic-listening-test.mp3'
          seconds=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',path]).decode().strip())
          assert 930 < seconds < 990, f'Unexpected audio length: {seconds}'
          print(f'ALI TOEIC listening audio verified: {seconds:.1f}s')
          PY
      - name: Publish MP3 to public GitHub Pages asset
        run: |
          git config user.name 'ALI Academy GitHub Actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/ali-tests/toeic-listening-test.mp3
          if git diff --cached --quiet; then echo 'Audio already published'; exit 0; fi
          git commit -m 'Publish verified TOEIC listening audio on ALI site'
          git push
