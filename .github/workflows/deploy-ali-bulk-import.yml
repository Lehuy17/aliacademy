name: Deploy ALI Admin Bulk Import (Firebase)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/index.js'
      - '.github/workflows/deploy-ali-bulk-import.yml'

permissions:
  contents: read

concurrency:
  group: ali-firebase-functions-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source (only backend and validation files)
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            firebase.json
            functions/
            teacher.html
            ali-teacher.js
            ali-teacher.css
            ali-bulk-import.js
            ali-cinema-player.js
            ali-members.js
            movies.html
            scripts/check-ali-teacher.cjs
            firestore-rules-teacher.txt
            storage-rules-teacher.txt
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm Firebase credential configured
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALI_ENGLISH }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_ALI_ENGLISH. Set it as a GitHub Actions repository secret using a restricted Firebase deploy service account."
            exit 1
          fi
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALI_ENGLISH }}
      - name: Check backend syntax and frontend integration
        run: |
          node --check functions/index.js
          node --check ali-bulk-import.js
          node scripts/check-ali-teacher.cjs
      - name: Install Firebase CLI and Function dependencies
        run: |
          npm install --prefix functions --no-audit --no-fund
          npm install --global firebase-tools
      - name: Deploy only adminImportStudents (asia-southeast1)
        run: firebase deploy --only functions:adminImportStudents --project ali-english --non-interactive
