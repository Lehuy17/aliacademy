name: Prepare The Emoji Movie Smiler Deletes Everybody as ALI synced HTML5 bilingual video

on:
  push:
    paths:
      - '.github/workflows/publish-emoji-movie-ali.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ali-emoji-movie-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install transcription and offline translation tools
        run: |
          set -euo pipefail
          python3 -m venv /tmp/ali-emoji-movie-env
          /tmp/ali-emoji-movie-env/bin/pip install --no-cache-dir \
            'gdown>=5.0,<6' 'faster-whisper>=1.1,<2' \
            'transformers>=4.44,<5' 'sentencepiece>=0.2,<1'
          /tmp/ali-emoji-movie-env/bin/pip install --no-cache-dir \
            --index-url https://download.pytorch.org/whl/cpu 'torch>=2.6,<3'
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Retrieve the exact user-supplied Google Drive video
        env:
          DRIVE_FILE_ID: 1tt0DYF1smEiyYNL03qDX9fA3yWwBO4c0
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if /tmp/ali-emoji-movie-env/bin/gdown --id "$DRIVE_FILE_ID" \
                 --output /tmp/ali-emoji-movie-original.mp4; then break; fi
            rm -f /tmp/ali-emoji-movie-original.mp4
            sleep 10
          done
          test -s /tmp/ali-emoji-movie-original.mp4
          python3 - <<'PY'
          import json, subprocess, pathlib
          p=pathlib.Path('/tmp/ali-emoji-movie-original.mp4')
          info=json.loads(subprocess.check_output([
            'ffprobe','-v','error','-show_entries',
            'format=duration:stream=codec_type,width,height,avg_frame_rate',
            '-of','json',str(p)]))
          sec=float(info['format']['duration'])
          assert 60 < sec < 1500, f'Unexpected original length: {sec:.3f}s'
          assert p.stat().st_size == 435_707_980, f'Wrong Drive source size: {p.stat().st_size}'
          streams=info['streams']
          video=next(v for v in streams if v['codec_type']=='video')
          assert video['width']>=1920 and video['height']>=1080, (
            f'Cannot export native 1080p from {video["width"]}x{video["height"]}; do not upscale')
          video_kbps=int((82*1048576*8)/(sec*1000)-128-35)
          assert video_kbps >= 550, f'Clip too long for useful 1080p within 90 MiB ({video_kbps}kbps); use video CDN'
          maxrate_kbps=int(min(5800,video_kbps*1.65))
          pathlib.Path('/tmp/ali-emoji-movie-vrate').write_text(str(video_kbps)+'k')
          pathlib.Path('/tmp/ali-emoji-movie-maxrate').write_text(str(maxrate_kbps)+'k')
          pathlib.Path('/tmp/ali-emoji-movie-bufsize').write_text(str(maxrate_kbps*2)+'k')
          print(f'Confirmed source: {sec:.3f}s, {p.stat().st_size} bytes, {video["width"]}x{video["height"]}, {video["avg_frame_rate"]}')
          print(f'1080p30 two-pass target video bitrate: {video_kbps} kbps; audio 128 kbps')
          PY

      - name: Produce same-origin, seekable H264/AAC movie and film poster
        run: |
          set -euo pipefail
          target='media/the-emoji-movie-smiler-delete-everybody'
          mkdir -p "$target"
          # Dynamic bitrate maximizes 1080p30 clarity without exceeding GitHub's <90 MiB gate.
          v_rate="$(cat /tmp/ali-emoji-movie-vrate)"
          v_maxrate="$(cat /tmp/ali-emoji-movie-maxrate)"
          v_bufsize="$(cat /tmp/ali-emoji-movie-bufsize)"
          ffmpeg -hide_banner -loglevel error -stats -nostdin -y \
            -i /tmp/ali-emoji-movie-original.mp4 \
            -map 0:v:0 -an \
            -vf 'scale=1920:1080:force_original_aspect_ratio=decrease:force_divisible_by=2' \
            -c:v libx264 -preset slow -profile:v high -level 4.1 \
            -pix_fmt yuv420p -r 30 -b:v "$v_rate" -maxrate "$v_maxrate" -bufsize "$v_bufsize" -g 60 \
            -pass 1 -passlogfile /tmp/ali-emoji-movie-x264 -f null /dev/null
          ffmpeg -hide_banner -loglevel error -stats -nostdin -y \
            -i /tmp/ali-emoji-movie-original.mp4 \
            -map 0:v:0 -map 0:a:0 \
            -vf 'scale=1920:1080:force_original_aspect_ratio=decrease:force_divisible_by=2' \
            -c:v libx264 -preset slow -profile:v high -level 4.1 \
            -pix_fmt yuv420p -r 30 -b:v "$v_rate" -maxrate "$v_maxrate" -bufsize "$v_bufsize" -g 60 \
            -pass 2 -passlogfile /tmp/ali-emoji-movie-x264 \
            -c:a aac -b:a 128k -ar 48000 -ac 2 -movflags +faststart \
            "$target/video.mp4"
          test "$(stat -c%s "$target/video.mp4")" -lt $((90*1024*1024))
          # Poster from the final encoded movie.
          ffmpeg -hide_banner -loglevel error -nostdin -y \
            -ss 45 -i "$target/video.mp4" -frames:v 1 -q:v 3 "$target/poster.jpg"
          ffmpeg -hide_banner -loglevel error -nostdin -y \
            -i /tmp/ali-emoji-movie-original.mp4 -vn -ac 1 -ar 16000 \
            /tmp/ali-emoji-movie-audio.wav

      # ASR uses WAV PCM decoding to avoid PyAV compatibility issues on Python 3.14.
      # Script verifies the original 1920x1080 quality before exporting timed bilingual subtitles.
      - name: Create real timed English dialogue and provisional Vietnamese translation
        run: |
          set -euo pipefail
          /tmp/ali-emoji-movie-env/bin/python scripts/prepare-emoji-movie-ali.py

      - name: Gate publication on complete media and caption structure
        run: |
          set -euo pipefail
          node scripts/validate-ali-movies.cjs
          python3 - <<'PY'
          import json,pathlib
          slug='the-emoji-movie-smiler-delete-everybody'
          p=pathlib.Path('captions')/(slug+'.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['status']=='machine_transcript_bilingual_unreviewed'
          assert len(d['cues'])>=10, 'No usable timed subtitles'
          assert all(c['en'].strip() and c['vi'].strip() for c in d['cues'])
          video=pathlib.Path('media')/slug/'video.mp4'
          import subprocess
          meta=json.loads(subprocess.check_output(['ffprobe','-v','error',
                 '-show_entries','stream=codec_type,width,height,avg_frame_rate','-of','json',str(video)]))
          v=next(x for x in meta['streams'] if x['codec_type']=='video')
          assert (v['width'],v['height'])==(1920,1080), 'Must retain original 1080p resolution'
          assert v['avg_frame_rate']=='30/1', 'Must retain original 30 fps'
          print('Draft transcript verified. Editorial & rights approvals remain pending.')
          PY

      - name: Publish only after validation succeeds
        run: |
          set -euo pipefail
          git config user.name 'ALI Academy Website Bot'
          git config user.email 'ali-website-bot@users.noreply.github.com'
          git add ali-movies.json \
            media/the-emoji-movie-smiler-delete-everybody/video.mp4 \
            media/the-emoji-movie-smiler-delete-everybody/poster.jpg \
            captions/the-emoji-movie-smiler-delete-everybody.json
          if git diff --cached --quiet; then
            echo 'No changes to publish'
            exit 0
          fi
          git commit -m 'Publish The Emoji Movie Smiler Deletes Everybody 1080p30 high-quality synced ALI lesson'
          git pull --rebase origin main
          git push origin HEAD:main
