name: Prepare A Few Good Men Objection Overruled as ALI synced HTML5 bilingual video

on:
  push:
    paths:
      - '.github/workflows/publish-a-few-good-men-ali.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ali-few-good-men-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install transcription and offline translation tools
        run: |
          set -euo pipefail
          python3 -m venv /tmp/ali-few-good-men-env
          /tmp/ali-few-good-men-env/bin/pip install --no-cache-dir \
            'gdown>=5.0,<6' 'faster-whisper>=1.1,<2' \
            'transformers>=4.44,<5' 'sentencepiece>=0.2,<1'
          /tmp/ali-few-good-men-env/bin/pip install --no-cache-dir \
            --index-url https://download.pytorch.org/whl/cpu 'torch>=2.6,<3'
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Retrieve the exact user-supplied Google Drive video
        env:
          DRIVE_FILE_ID: 1iabF_XnYk42YVwHu-pFHKWg2ag2Zr2cR
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if /tmp/ali-few-good-men-env/bin/gdown --id "$DRIVE_FILE_ID" \
                 --output /tmp/ali-few-good-men-original.mp4; then break; fi
            rm -f /tmp/ali-few-good-men-original.mp4
            sleep 10
          done
          test -s /tmp/ali-few-good-men-original.mp4
          python3 - <<'PY'
          import json,subprocess,pathlib
          p=pathlib.Path('/tmp/ali-few-good-men-original.mp4')
          d=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','json',str(p)]))
          sec=float(d['format']['duration'])
          assert 420 < sec < 423, f'Wrong source clip: {sec} seconds'
          assert p.stat().st_size == 349_831_407, f'Incomplete source: {p.stat().st_size}'
          print(f'Confirmed Google Drive source {sec:.3f}s and {p.stat().st_size} bytes')
          PY

      - name: Produce same-origin, seekable H264/AAC movie and film poster
        run: |
          set -euo pipefail
          target='media/a-few-good-men-objection-overruled'
          mkdir -p "$target"
          # This 7m01s original is 1080p HEVC. A high-quality two-pass
          # 1080p30 H264 encode maximizes detail within the 90 MiB GitHub cap.
          ffmpeg -hide_banner -loglevel error -stats -nostdin -y \
            -i /tmp/ali-few-good-men-original.mp4 \
            -map 0:v:0 -an \
            -vf 'scale=1920:1080:force_original_aspect_ratio=decrease:force_divisible_by=2' \
            -c:v libx264 -preset slow -profile:v high -level 4.1 \
            -pix_fmt yuv420p -r 30 -b:v 1540k -maxrate 2700k -bufsize 5400k -g 60 \
            -pass 1 -passlogfile /tmp/ali-few-good-men-x264 -f null /dev/null
          ffmpeg -hide_banner -loglevel error -stats -nostdin -y \
            -i /tmp/ali-few-good-men-original.mp4 \
            -map 0:v:0 -map 0:a:0 \
            -vf 'scale=1920:1080:force_original_aspect_ratio=decrease:force_divisible_by=2' \
            -c:v libx264 -preset slow -profile:v high -level 4.1 \
            -pix_fmt yuv420p -r 30 -b:v 1540k -maxrate 2700k -bufsize 5400k -g 60 \
            -pass 2 -passlogfile /tmp/ali-few-good-men-x264 \
            -c:a aac -b:a 128k -ar 48000 -ac 2 -movflags +faststart \
            "$target/video.mp4"
          test "$(stat -c%s "$target/video.mp4")" -lt $((90*1024*1024))
          # Poster from the final encoded movie.
          ffmpeg -hide_banner -loglevel error -nostdin -y \
            -ss 158 -i "$target/video.mp4" -frames:v 1 -q:v 3 "$target/poster.jpg"
          ffmpeg -hide_banner -loglevel error -nostdin -y \
            -i /tmp/ali-few-good-men-original.mp4 -vn -ac 1 -ar 16000 \
            /tmp/ali-few-good-men-audio.wav

      # ASR uses WAV PCM decoding to avoid PyAV compatibility issues on Python 3.14.
      # Script verifies the original 1920x1080 quality before exporting timed bilingual subtitles.
      - name: Create real timed English dialogue and provisional Vietnamese translation
        run: |
          set -euo pipefail
          /tmp/ali-few-good-men-env/bin/python scripts/prepare-a-few-good-men-ali.py

      - name: Gate publication on complete media and caption structure
        run: |
          set -euo pipefail
          node scripts/validate-ali-movies.cjs
          python3 - <<'PY'
          import json,pathlib
          slug='a-few-good-men-objection-overruled'
          p=pathlib.Path('captions')/(slug+'.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['status']=='machine_transcript_bilingual_unreviewed'
          assert len(d['cues'])>=10, 'No usable timed subtitles'
          assert all(c['en'].strip() and c['vi'].strip() for c in d['cues'])
          video=pathlib.Path('media')/slug/'video.mp4'
          import subprocess
          meta=json.loads(subprocess.check_output(['ffprobe','-v','error',
                 '-show_entries','stream=codec_type,width,height,avg_frame_rate','-of','json',str(video)]))
          v=next(x for x in meta['streams'] if x['codec_type']=='video')
          assert (v['width'],v['height'])==(1920,1080), 'Must retain original 1080p resolution'
          assert v['avg_frame_rate']=='30/1', 'Must retain original 30 fps'
          print('Draft transcript verified. Editorial & rights approvals remain pending.')
          PY

      - name: Publish only after validation succeeds
        run: |
          set -euo pipefail
          git config user.name 'ALI Academy Website Bot'
          git config user.email 'ali-website-bot@users.noreply.github.com'
          git add ali-movies.json \
            media/a-few-good-men-objection-overruled/video.mp4 \
            media/a-few-good-men-objection-overruled/poster.jpg \
            captions/a-few-good-men-objection-overruled.json
          if git diff --cached --quiet; then
            echo 'No changes to publish'
            exit 0
          fi
          git commit -m 'Publish A Few Good Men Objection Overruled 1080p30 high-quality synced ALI lesson'
          git pull --rebase origin main
          git push origin HEAD:main
